ll="#1c5cab"/><circle cx="1109.0" cy="177.29166666666669" r="3.5" fill="#1a1a1a" stroke="#fff" stroke-width="1.5"/><path d="M1126,520 V174.0 Q1126,170.0 1130,170.0 H1152 Q1156,170.0 1156,174.0 V520 Z" fill="#104281"/><circle cx="1141.0" cy="170.0" r="3.5" fill="#1a1a1a" stroke="#fff" stroke-width="1.5"/><line x1="992" y1="520" x2="1162" y2="520" stroke="#5e5b55" stroke-width="1"/><text x="1077.0" y="542" text-anchor="middle" dominant-baseline="middle" font-family="'Noto Sans CJK SC','WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a">没有异常</text><text x="1077.0" y="562" text-anchor="middle" dominant-baseline="middle" font-family="'Noto Sans CJK SC','WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5e5b55">归因，对照 · 48 题</text><text x="110" y="600" text-anchor="start" dominant-baseline="middle" font-family="'Noto Sans CJK SC','WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5e5b55">读法：补稀有类示范让召回下降从 0–1 题到全对；策略调整示范写出“先列约束、再比较候选线”，让收紧分数线从 4–27 题到 53–54 题；</text><text x="110" y="622" text-anchor="start" dominant-baseline="middle" font-family="'Noto Sans CJK SC','WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5e5b55">训练加一种问法，让测试专用问法从此前的 1–12 题到 15 题，但训练 2 轮后两个种子又分成 13 和 3 题，这一类还不稳。</text><text x="110" y="644" text-anchor="start" dominant-baseline="middle" font-family="'Noto Sans CJK SC','WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5e5b55">模型漂移类没有哪一步专门针对它，各次运行在 12–29 题之间，是现在最大的短板；没有异常类是对照，各步基本不变（374 条那组有一个种子例外）。</text><text x="110" y="666" text-anchor="start" dominant-baseline="middle" font-family="'Noto Sans CJK SC','WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5e5b55">另一组对照：去掉策略调整示范、只训归因，策略调整总分从 136–147 题掉到 43–52 题（共 150 题），归因不变（177 / 181 题）。</text></svg>